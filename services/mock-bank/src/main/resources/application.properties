spring.application.name=mock-bank
server.port=${PORT:8081}

# Max CSV upload size
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=mock-bank

# Fault injection defaults (overridable via env, changeable at runtime via POST /admin/faults)
mockbank.faults.mode=${MOCKBANK_FAULT_MODE:ok}
mockbank.faults.error-rate=${MOCKBANK_FAULT_ERROR_RATE:1.0}
mockbank.faults.latency-ms=${MOCKBANK_FAULT_LATENCY_MS:0}
# How long a "timeout" fault hangs before answering 504
mockbank.faults.timeout-ms=${MOCKBANK_FAULT_TIMEOUT_MS:30000}
