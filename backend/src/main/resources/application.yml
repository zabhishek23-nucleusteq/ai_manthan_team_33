spring:
  application:
    name: expenseflow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/expenseflow}
    username: ${DB_USER:expenseflow}
    password: ${DB_PASSWORD:expenseflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB

app:
  jwt:
    # HS256 secret, at least 32 bytes. Real value comes from .env (JWT_SECRET); this default is for local dev only.
    secret: ${JWT_SECRET:local-dev-only-secret-change-me-0123456789abcdef}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: expenseflow

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  error:
    include-message: never
