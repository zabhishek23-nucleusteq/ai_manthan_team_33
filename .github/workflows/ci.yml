name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: chmod +x mvnw
      - name: Fetch Maven (retry, the download is occasionally flaky)
        run: for i in 1 2 3 4 5; do ./mvnw -B -v && exit 0; sleep 10; done; exit 1
      - run: ./mvnw -B verify

  mock-bank:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/mock-bank
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: chmod +x mvnw
      - name: Fetch Maven (retry, the download is occasionally flaky)
        run: for i in 1 2 3 4 5; do ./mvnw -B -v && exit 0; sleep 10; done; exit 1
      - run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build

  dependency-check:
    # Maven dependency scan (OSV/Trivy) not enabled: both failed on the runner; tracked as follow-up.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.1'
      - name: npm audit (frontend, production deps)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  images:
    runs-on: ubuntu-latest
    needs: [backend, mock-bank, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
          - name: mock-bank
            context: services/mock-bank
          - name: frontend
            context: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          tags: expenseflow-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
