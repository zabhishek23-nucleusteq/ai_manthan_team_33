name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      MVNW_REPOURL: https://repo1.maven.org/maven2
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: chmod +x mvnw
      - name: Fetch Maven (retry, the download is occasionally flaky)
        run: for i in 1 2 3 4 5; do ./mvnw -B -v && exit 0; sleep 10; done; exit 1
      - run: ./mvnw -B verify

  mock-bank:
    runs-on: ubuntu-latest
    env:
      MVNW_REPOURL: https://repo1.maven.org/maven2
    defaults:
      run:
        working-directory: services/mock-bank
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: chmod +x mvnw
      - name: Fetch Maven (retry, the download is occasionally flaky)
        run: for i in 1 2 3 4 5; do ./mvnw -B -v && exit 0; sleep 10; done; exit 1
      - run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build

  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.1'
      - name: npm audit (frontend, production deps)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: SBOM for Maven modules (CycloneDX)
        env:
          MVNW_REPOURL: https://repo1.maven.org/maven2
        run: |
          for m in backend services/mock-bank; do
            (cd $m && chmod +x mvnw && ./mvnw -B -q org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -DoutputFormat=json -DoutputName=bom)
          done
      - name: OSV scan of Maven dependencies (fails on known vulnerabilities)
        run: |
          curl -sSfL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.0.2/osv-scanner_linux_amd64
          chmod +x osv-scanner
          ./osv-scanner scan --sbom backend/target/bom.json --sbom services/mock-bank/target/bom.json

  images:
    runs-on: ubuntu-latest
    needs: [backend, mock-bank, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
          - name: mock-bank
            context: services/mock-bank
          - name: frontend
            context: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          tags: expenseflow-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  e2e-api:
    runs-on: ubuntu-latest
    needs: [backend, mock-bank, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.1'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose up --build -d
          for i in $(seq 1 90); do
            curl -fs http://localhost:8080/actuator/health | grep -q '"UP"' && exit 0
            sleep 2
          done
          docker compose logs backend --tail 100
          exit 1
      - run: npm ci
        working-directory: tests/e2e
      - name: RBAC API matrix
        run: npx playwright test --project=api
        working-directory: tests/e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --tail 200
