services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME:-expenseflow}
      POSTGRES_USER: ${DB_USER:-expenseflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  mock-bank:
    build: ./services/mock-bank
    ports:
      - "${MOCK_BANK_PORT:-8081}:8081"

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      mock-bank:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-seed}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-expenseflow}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-expenseflow}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-change-me}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-dev-only-change-me-32b}
      MOCK_BANK_URL: http://mock-bank:8081
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  pgdata:
