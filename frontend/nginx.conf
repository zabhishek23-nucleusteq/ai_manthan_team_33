server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API calls go to the Spring Boot backend (compose service "backend").
  # Resolve at request time (Docker DNS) so nginx still starts and serves the UI when the
  # backend is down or not created yet; /api then returns 502 instead of the whole site failing.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend_upstream http://backend:8080;
  location /api/ {
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Hashed assets: cache long.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SPA fallback: every other route serves index.html (no cache so new deploys show up).
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
