global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alert rules are added with T-036 (infra/prometheus/alerts.yml); the glob matches nothing until then.
rule_files:
  - /etc/prometheus/alerts*.yml

scrape_configs:
  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['backend:8080']
  - job_name: mock-bank
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['mock-bank:8081']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
